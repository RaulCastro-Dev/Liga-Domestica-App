<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffbff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>Liga Doméstica</title>
  <meta name="description" content="Competición familiar por las tareas del hogar: puntos, ranking, rachas y premios.">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- Barra superior -->
    <header class="appbar" id="appbar">
      <div class="appbar-titulo">
        <span class="logo" aria-hidden="true">🏆</span>
        <div>
          <h1>Liga Doméstica</h1>
          <p class="sub" id="temporada"></p>
        </div>
      </div>
      <button class="avatar-btn pulsable" id="btn-jugador" data-accion="jugador" aria-label="Cambiar de jugador"></button>
    </header>

    <main id="vista" tabindex="-1"></main>

    <!-- Botón flotante: registrar tarea -->
    <button class="fab pulsable" id="fab" data-accion="registrar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Registrar tarea</span>
    </button>

    <!-- Barra de navegación inferior -->
    <nav class="navbar" aria-label="Navegación principal">
      <a href="#ranking" class="nav-item pulsable" data-vista="ranking">
        <span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></span>
        <span>Ranking</span>
      </a>
      <a href="#tareas" class="nav-item pulsable" data-vista="tareas">
        <span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 11 3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></span>
        <span>Tareas</span>
      </a>
      <a href="#actividad" class="nav-item pulsable" data-vista="actividad">
        <span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></span>
        <span>Actividad</span>
        <b class="badge" id="badge-actividad" hidden>0</b>
      </a>
      <a href="#premios" class="nav-item pulsable" data-vista="premios">
        <span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7Z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7Z"/></svg></span>
        <span>Premios</span>
      </a>
      <a href="#perfil" class="nav-item pulsable" data-vista="perfil">
        <span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <span>Perfil</span>
      </a>
    </nav>
  </div>

  <!-- Hoja inferior (registrar tarea, cambiar de jugador) -->
  <dialog class="hoja" id="hoja" aria-labelledby="hoja-titulo">
    <div class="hoja-asa" aria-hidden="true"></div>
    <div class="hoja-cuerpo" id="hoja-cuerpo"></div>
  </dialog>

  <!-- Aviso con acción de deshacer -->
  <div class="snackbar" id="snackbar" role="status" aria-live="polite">
    <span id="snack-texto"></span>
    <button class="btn-text pulsable" id="snack-accion" data-accion="deshacer" hidden>Deshacer</button>
  </div>

  <div class="confeti" id="confeti" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
